[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fptu-recommendation-engine"
version = "0.1.0"
description = "Deterministic club and activity recommendations from backend snapshots"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
recommendation-engine = "recommendation_engine.cli:main"

[tool.setuptools.packages.find]
include = ["recommendation_engine*"]
